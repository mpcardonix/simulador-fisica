<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de física</title>

    <link rel="stylesheet" href="src/css/bootstrap.min.css">
    <link rel="stylesheet" href="src/css/style.css">

    <script src="src/js/chart.umd.min.js"></script>
    <script src="src/js/ChartHandler.js"></script>
</head>
<body>
    <h2 class="text-center mt-5">Simulador de física</h2>

    <div class="container mt-5">
            <canvas id="myChart"></canvas>
        
            <div class="container mt-4">
                <table class="table table-striped">
                    <thead>
                        <tr class="text-center fw-bold">
                            <td>Nome</td>
                            <td>T-inicial</td>
                            <td>T-fusão</td>
                            <td>T-ebulição</td>
                            <td>T-final</td>
                            <td>Excluir</td>
                            <!--<td>Cor</td>-->
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr>
                            <td><input type="text" class="form-control text-center" value="Água"></td>
                            <td><input type="text" class="form-control text-center" value="-20"></td>
                            <td><input type="text" class="form-control text-center" value="0"></td>
                            <td><input type="text" class="form-control text-center" value="100"></td>
                            <td><input type="text" class="form-control text-center" value="120"></td>
                            <td><button class="btn btn-danger">Excluir</button></td>
                        </tr>
                        <tr id="lastRow">
                            <td colspan="10"><button id="addMaterial" class="btn btn-success w-100" value="Adicionar novo material"><h5>Adicionar novo material</h5></button></td>
                        </tr>
                    </tbody>
                </table>
            </div>
    </div>






    <script src="src/js/index.js"></script>
</body>
</html>
